  <section>
    <h1>Contact Me</h1>
    <p>Have a question or want to discuss a project? Fill out the form below, please and thank you.</p>

    <form action="https://formsubmit.co/cf7c5a708817b285eab2b27c65362277" method="POST">
      
      <input type="hidden" name="_subject" value="New Contact Form Submission!">
      <input type="hidden" name="_captcha" value="false">

      <p>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required placeholder="Your Full Name">
      </p>

      <p>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="your@email.com">
      </p>

      <p>
        <label for="content">Message</label>
        <textarea name="content" id="content" rows="5" required placeholder="How can I help you?"></textarea>
      </p>

      <button type="submit">Send Message</button>
    </form>
  </section>

</body>
</html>
